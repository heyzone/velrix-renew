name: 🎮 Velrix 自动续期

on:
  schedule:
    - cron: '0 2 */5 * *'      # 每5天 UTC 02:00 运行（可按需调整）
  workflow_dispatch:           # 支持手动触发

jobs:
  renew:
    name: 🔄 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. 拉取代码 ────────────────────────────────────────
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      # ── 2. 安装 Python ──────────────────────────────────────
      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. 安装 SeleniumBase ────────────────────────────────
      - name: 📦 安装依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver
          sudo apt-get install -y xvfb

      # ── 4. 启动 GOST 代理（仅在 Secret 存在时执行）─────────
      - name: 🛡️ 启动 GOST 代理转发
        if: ${{ env.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $VERSION"
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3
          echo "✅ GOST 已启动，测试连通性..."
          curl -s -x http://127.0.0.1:8080 https://api.ipify.org \
            | sed 's/\.[0-9]*$/.**/' && echo

      # ── 5. 运行续期脚本 ─────────────────────────────────────
      - name: 🚀 运行续期脚本
        env:
          # Secret 格式: username,gmail_address,gmail_app_password
          VELRIX_ACCOUNT: ${{ secrets.VELRIX_ACCOUNT }}
          # Secret 格式: tg_chat_id,bot_token
          TG_BOT:         ${{ secrets.TG_BOT }}
          GOST_PROXY:     ${{ secrets.GOST_PROXY && 'http://127.0.0.1:8080' || '' }}
          DISPLAY:        :99
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          python renew_velrix.py

      # ── 6. 上传失败截图 ─────────────────────────────────────
      - name: 📸 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: "*.png"
          retention-days: 7
